# Test Configuration for Credit Points Application
# Use with: mvn test -Dspring.profiles.active=test
# Or tests will automatically use 'test' profile if this file exists

# Application Configuration
spring.application.name=credit-app-test
server.port=8081

# ===================================================================
# H2 In-Memory Database Configuration for Testing
# ===================================================================
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:creditapp_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# JPA/Hibernate Configuration for Tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=false

# Disable SQL initialization in tests
spring.sql.init.mode=never
spring.sql.init.enabled=false
spring.jpa.defer-datasource-initialization=false

# H2 Console (optional - can enable for debugging tests)
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# Logging Configuration (minimal for tests)
logging.level.com.creditapp=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.test=INFO

# Server Configuration
server.servlet.session.timeout=5m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false

# Security Configuration for Tests
spring.security.csrf.enabled=false
spring.security.user.name=test
spring.security.user.password=test123

# Application-specific settings for tests
creditapp.default-parent-username=parent
creditapp.default-parent-password=parent123
creditapp.default-child-username=child
creditapp.default-child-password=child123
creditapp.marketplace.enabled=true
creditapp.task.daily-limit-check=false
creditapp.version=1.0.0-test
creditapp.development-mode=true

# Disable management endpoints in tests
management.endpoints.web.exposure.include=none
