# Development Configuration for Credit Points Application
# Use with: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# Or: java -jar target/credit-app-1.0.0.jar --spring.profiles.active=dev
#
# NOTE: Now using MySQL database (H2 config commented out below for reference)

# Application Configuration
spring.application.name=credit-app-dev
server.port=8080

# ===================================================================
# MySQL Database Configuration (Active)
# ===================================================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://192.168.9.113:3306/creditapp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456

# JPA Configuration for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# ===================================================================
# H2 Database Configuration (Commented out - for reference only)
# ===================================================================
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.url=jdbc:h2:mem:creditapp;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
# spring.datasource.username=sa
# spring.datasource.password=
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# SQL Data Initialization
spring.sql.init.mode=embedded
spring.sql.init.enabled=true
spring.sql.init.continue-on-error=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.schema-locations=classpath:data-seed.sql

# H2 Console (Disabled when using MySQL)
# Uncomment below to enable H2 console (only works with H2 database)
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console
# spring.h2.console.settings.trace=false
# spring.h2.console.settings.web-allow-others=false

# Thymeleaf Configuration (disable cache for development)
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.check-template-location=true

# Logging Configuration (verbose for development)
logging.level.com.creditapp=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.web=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Server Configuration
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=false
server.servlet.session.cookie.secure=false
server.error.include-stacktrace=always
server.error.include-message=always
server.error.include-binding-errors=always

# Security Configuration (Development)
# CSRF protection disabled for easier testing
spring.security.csrf.enabled=false

# Development features
creditapp.development-mode=true
creditapp.show-sql-queries=true
creditapp.enable-test-data=true

# Default accounts for development
creditapp.default-parent-username=parent
creditapp.default-parent-password=parent123
creditapp.default-child-username=child
creditapp.default-child-password=child123

# Marketplace feature settings
creditapp.marketplace.enabled=true
creditapp.marketplace.max-tasks-per-child=10

# Task completion settings
creditapp.task.daily-limit-check=true
creditapp.task.auto-approval=false

# Points system settings
creditapp.points.initial-balance=0
creditapp.points.minimum-balance=0

# Development tools
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
spring.boot.admin.client.enabled=false