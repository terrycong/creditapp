# ===================================================================
# Development Profile Configuration
# Credit Points Application - Development Environment
# ===================================================================
# Usage:
#   mvn spring-boot:run -Dspring-boot.run.profiles=dev
#   java -jar target/credit-app-1.0.0.jar --spring.profiles.active=dev
# ===================================================================

# Application Configuration
spring.application.name=credit-app-dev
server.port=8080

# ===================================================================
# Database Configuration - H2 (Development)
# ===================================================================
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:creditapp;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (Enabled for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.trace=false
spring.h2.console.settings.web-allow-others=false

# Liquibase Configuration
spring.liquibase.enabled=false

# SQL Data Initialization (handled by Liquibase)
spring.sql.init.mode=never
spring.sql.init.enabled=false

# ===================================================================
# Thymeleaf Configuration
# ===================================================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.check-template-location=true

# ===================================================================
# Logging Configuration (Verbose for Development)
# ===================================================================
logging.level.com.creditapp=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.web=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# ===================================================================
# Server Configuration (Development)
# ===================================================================
server.servlet.session.timeout=60m
server.servlet.session.cookie.http-only=false
server.servlet.session.cookie.secure=false
server.error.include-stacktrace=always
server.error.include-message=always
server.error.include-binding-errors=always

# ===================================================================
# Security Configuration (Development)
# ===================================================================
spring.security.csrf.enabled=false

# ===================================================================
# Development Features
# ===================================================================
creditapp.development-mode=true
creditapp.show-sql-queries=true
creditapp.enable-test-data=true

# Default accounts for development
creditapp.default-parent-username=parent
creditapp.default-parent-password=parent123
creditapp.default-child-username=child
creditapp.default-child-password=child123

# Feature settings
creditapp.marketplace.enabled=true
creditapp.marketplace.max-tasks-per-child=10
creditapp.task.daily-limit-check=true
creditapp.task.auto-approval=false
creditapp.points.initial-balance=0
creditapp.points.minimum-balance=0

# Development tools
management.endpoints.web.exposure.include=health,info,metrics,loggers
management.endpoint.health.show-details=always
spring.boot.admin.client.enabled=false
