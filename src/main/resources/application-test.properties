# Test Profile Configuration
# Used for running tests with H2 in-memory database

# H2 In-Memory Database
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (useful for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Liquibase - DISABLED for tests (using ddl-auto)
spring.liquibase.enabled=false

# SQL Initialization
spring.sql.init.mode=never

# Logging
logging.level.com.creditapp=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Security - disable for tests
spring.security.user.name=test
spring.security.user.password=test

# Application Settings
creditapp.default-parent-username=parent
creditapp.default-parent-password=parent123
creditapp.default-child-username=child
creditapp.default-child-password=child123
creditapp.marketplace.enabled=true
creditapp.task.daily-limit-check=true

# Server
server.port=0

# Database Backup (for tests)
database.backup.enabled=false
database.backup.dir=./test-backups
database.backup.retention-days=1