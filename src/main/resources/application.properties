# Default Configuration for Credit Points Application
# This is the base configuration. Use profiles for environment-specific settings.
# 
# Available profiles:
# - dev: Development environment with H2 database
# - prod: Production environment with MySQL database
#
# Usage:
# Development: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# Production:  mvn spring-boot:run -Dspring-boot.run.profiles=prod
# Or: java -jar target/credit-app-1.0.0.jar --spring.profiles.active=prod

# Application Configuration
spring.application.name=credit-app
server.port=8080

# Default profile (development)
spring.profiles.active=dev

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# SQL Data Initialization
spring.sql.init.mode=never
spring.sql.init.enabled=false

# Thymeleaf Configuration
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# Logging Configuration
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Security Configuration
# CSRF protection - disabled by default, enabled in production profile
spring.security.csrf.enabled=false

# Server Configuration
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true

# Application-specific settings
creditapp.default-parent-username=parent
creditapp.default-parent-password=parent123
creditapp.default-child-username=child
creditapp.default-child-password=child123
creditapp.marketplace.enabled=true
creditapp.task.daily-limit-check=true
creditapp.version=1.4.0
creditapp.build.date=@build.timestamp@

# Database Backup Configuration
database.backup.enabled=true
database.backup.dir=./backups
database.backup.retention-days=30
