<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仪表板 - 家庭积分系统</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    
    <style>
        :root {
            --primary-color: #4F46E5;
            --success-color: #10B981;
            --warning-color: #F59E0B;
            --danger-color: #EF4444;
            --info-color: #3B82F6;
        }
        
        body {
            background-color: #f8f9fa;
        }
        
        .navbar-brand {
            font-weight: bold;
            color: var(--primary-color) !important;
        }
        
        .stat-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            transition: transform 0.2s;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
        }
        
        .stat-icon {
            font-size: 2.5rem;
            border-radius: 50%;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }
        
        .icon-primary { background-color: rgba(79, 70, 229, 0.1); color: var(--primary-color); }
        .icon-success { background-color: rgba(16, 185, 129, 0.1); color: var(--success-color); }
        .icon-warning { background-color: rgba(245, 158, 11, 0.1); color: var(--warning-color); }
        .icon-info { background-color: rgba(59, 130, 246, 0.1); color: var(--info-color); }
        
        .section-title {
            color: #374151;
            font-weight: 600;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="/dashboard">
                <i class="bi bi-gift-fill"></i> 家庭积分系统
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/dashboard">
                            <i class="bi bi-house-door"></i> 首页
                        </a>
                    </li>
                    <li th:if="${role == 'PARENT'}" class="nav-item">
                        <a class="nav-link" href="/parent/tasks">
                            <i class="bi bi-list-check"></i> 任务管理
                        </a>
                    </li>
                    <li th:if="${role == 'PARENT'}" class="nav-item">
                        <a class="nav-link" href="/parent/rewards">
                            <i class="bi bi-gift"></i> 礼物管理
                        </a>
                    </li>
                    <li th:if="${role == 'PARENT'}" class="nav-item">
                        <a class="nav-link" href="/parent/children">
                            <i class="bi bi-people"></i> 小孩管理
                        </a>
                    </li>
                    <li th:if="${role == 'CHILD'}" class="nav-item">
                        <a class="nav-link" href="/child/tasks">
                            <i class="bi bi-list-check"></i> 我的任务
                        </a>
                    </li>
                    <li th:if="${role == 'CHILD'}" class="nav-item">
                        <a class="nav-link" href="/child/rewards">
                            <i class="bi bi-gift"></i> 礼物商城
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/login">
                            <i class="bi bi-box-arrow-right"></i> 退出
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row mb-4">
            <div class="col-12">
                <h1 class="section-title animate__animated animate__fadeInLeft">
                    <i class="bi bi-speedometer2"></i> 欢迎使用家庭积分系统
                </h1>
            </div>
        </div>

        <div class="row mb-5 animate__animated animate__fadeInUp">
            <div th:if="${role == 'PARENT'}" class="col-md-3">
                <div class="stat-card text-center p-4">
                    <div class="stat-icon icon-primary mx-auto">
                        <i class="bi bi-people-fill"></i>
                    </div>
                    <h3 class="mb-2">2</h3>
                    <p class="text-muted mb-0">家庭成员</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card text-center p-4">
                    <div class="stat-icon icon-success mx-auto">
                        <i class="bi bi-check-circle-fill"></i>
                    </div>
                    <h3 class="mb-2">10</h3>
                    <p class="text-muted mb-0">已完成任务</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card text-center p-4">
                    <div class="stat-icon icon-warning mx-auto">
                        <i class="bi bi-list-check"></i>
                    </div>
                    <h3 class="mb-2">4</h3>
                    <p class="text-muted mb-0">待完成任务</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card text-center p-4">
                    <div class="stat-icon icon-info mx-auto">
                        <i class="bi bi-gift"></i>
                    </div>
                    <h3 class="mb-2">6</h3>
                    <p class="text-muted mb-0">可兑换礼物</p>
                </div>
            </div>
        </div>

        <div class="row">
            <div th:if="${role == 'PARENT'}" class="col-md-6">
                <div class="card animate__animated animate__fadeInLeft">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="bi bi-speedometer2"></i> 快速操作
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="d-grid gap-2">
                            <a href="/parent/tasks" class="btn btn-primary">
                                <i class="bi bi-plus-circle"></i> 创建新任务
                            </a>
                            <a href="/parent/rewards" class="btn btn-success">
                                <i class="bi bi-plus-circle"></i> 添加新礼物
                            </a>
                            <a href="/parent/children" class="btn btn-info">
                                <i class="bi bi-person-plus"></i> 管理小孩账号
                            </a>
                        </div>
                    </div>
                </div>
            </div>
            
            <div th:if="${role == 'CHILD'}" class="col-md-6">
                <div class="card animate__animated animate__fadeInRight">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="bi bi-speedometer2"></i> 我的任务
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="d-grid gap-2">
                            <a href="/child/tasks" class="btn btn-primary">
                                <i class="bi bi-list-check"></i> 查看所有任务
                            </a>
                            <a href="/child/tasks" class="btn btn-success">
                                <i class="bi bi-check-circle"></i> 完成任务
                            </a>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card animate__animated animate__fadeInRight">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="bi bi-clock-history"></i> 最近动态
                        </h5>
                    </div>
                    <div class="card-body">
                        <ul class="list-unstyled">
                            <li class="mb-3">
                                <i class="bi bi-check-circle-fill text-success"></i>
                                <span>你完成了"完成作业"任务，获得10积分</span>
                                <small class="text-muted d-block">2小时前</small>
                            </li>
                            <li class="mb-3">
                                <i class="bi bi-gift-fill text-warning"></i>
                                <span>你兑换了"游戏时间"，消耗20积分</span>
                                <small class="text-muted d-block">昨天</small>
                            </li>
                            <li>
                                <i class="bi bi-plus-circle text-primary"></i>
                                <span>家长为你创建了新任务</span>
                                <small class="text-muted d-block">2天前</small>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-3 mt-5">
        <div class="container">
            <p>&copy; 2024 家庭积分系统. 让爱与陪伴一起成长！</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
