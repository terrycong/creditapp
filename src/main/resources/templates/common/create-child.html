<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>创建小孩账号 - 家庭积分系统</title>
    
    <!-- Bootstrap 5 CSS -->
    <link th:href="@{/webjars/bootstrap/5.3.3/dist/css/bootstrap.min.css}" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.css}" rel="stylesheet">
    <!-- Animate.css -->
    <link th:href="@{/webjars/animate.css/4.1.1/animate.min.css}" rel="stylesheet"/>
    
    <style>
        :root {
            --primary-color: #4F46E5;
            --success-color: #10B981;
            --warning-color: #F59E0B;
            --danger-color: #EF4444;
            --info-color: #3B82F6;
        }
        
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .navbar-brand {
            font-weight: bold;
            color: var(--primary-color) !important;
        }
        
        .create-child-container {
            max-width: 600px;
            margin: 0 auto;
        }
        
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        
        .form-icon {
            color: var(--primary-color);
            font-size: 1.2rem;
        }
        
        .btn-submit {
            background: linear-gradient(135deg, var(--primary-color), #6366F1);
            border: none;
            padding: 12px 30px;
            font-weight: 600;
        }
        
        .btn-submit:hover {
            background: linear-gradient(135deg, #6366F1, var(--primary-color));
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.3);
        }
        
        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.25rem rgba(79, 70, 229, 0.25);
        }
        
        .password-strength {
            height: 5px;
            border-radius: 2.5px;
            margin-top: 5px;
            transition: all 0.3s;
        }
        
        .strength-weak { background-color: var(--danger-color); width: 25%; }
        .strength-fair { background-color: var(--warning-color); width: 50%; }
        .strength-good { background-color: var(--info-color); width: 75%; }
        .strength-strong { background-color: var(--success-color); width: 100%; }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="/dashboard">
                <i class="bi bi-gift-fill"></i> 家庭积分系统
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/dashboard">
                            <i class="bi bi-house-door"></i> 返回首页
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-5 flex-grow-1">
        <div class="create-child-container animate__animated animate__fadeIn">
            <div class="text-center mb-5">
                <h1 class="display-5 fw-bold text-primary">
                    <i class="bi bi-person-plus"></i> 创建小孩账号
                </h1>
                <p class="lead text-muted">
                    为你的家庭添加新成员，让他们也能参与积分系统
                </p>
            </div>

            <div class="card p-4">
                <div class="card-body">
                    <!-- Success Message -->
                    <div th:if="${param.success}" class="alert alert-success alert-dismissible fade show" role="alert">
                        <i class="bi bi-check-circle-fill"></i> 小孩账号创建成功！
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    
                    <!-- Error Message -->
                    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${error}">错误信息</span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <form th:action="@{/parent/create-child}" method="post">
                        <div class="mb-4">
                            <label for="username" class="form-label fw-semibold">
                                <i class="bi bi-person-circle form-icon"></i> 用户名
                            </label>
                            <input type="text" class="form-control form-control-lg" 
                                   id="username" name="username" 
                                   placeholder="请输入小孩的用户名" required
                                   th:classappend="${#fields.hasErrors('username') ? 'is-invalid' : ''}">
                            <div class="form-text">
                                用户名用于登录，建议使用英文或拼音
                            </div>
                            <div th:if="${#fields.hasErrors('username')}" class="invalid-feedback">
                                <span th:errors="*{username}">用户名错误</span>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold">
                                <i class="bi bi-lock form-icon"></i> 密码
                            </label>
                            <input type="password" class="form-control form-control-lg" 
                                   id="password" name="password" 
                                   placeholder="请输入密码" required
                                   th:classappend="${#fields.hasErrors('password') ? 'is-invalid' : ''}"
                                   onkeyup="checkPasswordStrength(this.value)">
                            <div class="password-strength" id="passwordStrength"></div>
                            <div class="form-text">
                                密码至少6位，包含字母和数字
                            </div>
                            <div th:if="${#fields.hasErrors('password')}" class="invalid-feedback">
                                <span th:errors="*{password}">密码错误</span>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="confirmPassword" class="form-label fw-semibold">
                                <i class="bi bi-lock-fill form-icon"></i> 确认密码
                            </label>
                            <input type="password" class="form-control form-control-lg" 
                                   id="confirmPassword" name="confirmPassword" 
                                   placeholder="请再次输入密码" required
                                   th:classappend="${#fields.hasErrors('confirmPassword') ? 'is-invalid' : ''}"
                                   onkeyup="checkPasswordMatch()">
                            <div class="form-text" id="passwordMatchText"></div>
                            <div th:if="${#fields.hasErrors('confirmPassword')}" class="invalid-feedback">
                                <span th:errors="*{confirmPassword}">确认密码错误</span>
                            </div>
                        </div>

                        <div class="mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="terms" required>
                                <label class="form-check-label" for="terms">
                                    我同意创建小孩账号，并会指导小孩正确使用积分系统
                                </label>
                            </div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-submit btn-lg">
                                <i class="bi bi-person-plus"></i> 创建账号
                            </button>
                            <a href="/parent/children" class="btn btn-outline-secondary btn-lg">
                                <i class="bi bi-arrow-left"></i> 返回小孩管理
                            </a>
                        </div>
                    </form>

                    <div class="mt-5 pt-4 border-top">
                        <h5 class="fw-semibold mb-3">
                            <i class="bi bi-info-circle text-primary"></i> 创建小孩账号的注意事项：
                        </h5>
                        <ul class="list-unstyled text-muted">
                            <li class="mb-2">
                                <i class="bi bi-check-circle text-success"></i> 每个小孩账号独立，有自己的积分和任务
                            </li>
                            <li class="mb-2">
                                <i class="bi bi-check-circle text-success"></i> 家长可以查看和管理所有小孩的账号
                            </li>
                            <li class="mb-2">
                                <i class="bi bi-check-circle text-success"></i> 小孩只能看到自己的任务和积分
                            </li>
                            <li class="mb-2">
                                <i class="bi bi-check-circle text-success"></i> 请妥善保管小孩的登录信息
                            </li>
                            <li>
                                <i class="bi bi-check-circle text-success"></i> 可以随时修改或删除小孩账号
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-3 mt-5">
        <div class="container">
            <p>&copy; 2024 家庭积分系统. 让爱与陪伴一起成长！</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script th:src="@{/webjars/bootstrap/5.3.3/dist/js/bootstrap.bundle.min.js}"></script>
    
    <script>
        function checkPasswordStrength(password) {
            const strengthBar = document.getElementById('passwordStrength');
            let strength = 0;
            
            if (password.length >= 6) strength++;
            if (password.match(/[a-z]/) && password.match(/[A-Z]/)) strength++;
            if (password.match(/\d/)) strength++;
            if (password.match(/[^a-zA-Z\d]/)) strength++;
            
            strengthBar.className = 'password-strength';
            if (password.length === 0) {
                strengthBar.style.width = '0%';
            } else if (strength === 1) {
                strengthBar.className += ' strength-weak';
            } else if (strength === 2) {
                strengthBar.className += ' strength-fair';
            } else if (strength === 3) {
                strengthBar.className += ' strength-good';
            } else if (strength >= 4) {
                strengthBar.className += ' strength-strong';
            }
        }
        
        function checkPasswordMatch() {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const matchText = document.getElementById('passwordMatchText');
            
            if (confirmPassword.length === 0) {
                matchText.textContent = '';
                matchText.className = 'form-text';
            } else if (password === confirmPassword) {
                matchText.textContent = '✓ 密码匹配';
                matchText.className = 'form-text text-success';
            } else {
                matchText.textContent = '✗ 密码不匹配';
                matchText.className = 'form-text text-danger';
            }
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            checkPasswordStrength(document.getElementById('password').value);
            checkPasswordMatch();
        });
    </script>
</body>
</html>
