<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 家庭积分系统</title>
    
    <!-- Bootstrap 5 CSS -->
    <link th:href="@{/webjars/bootstrap/5.3.3/dist/css/bootstrap.min.css}" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.css}" rel="stylesheet">
    <!-- Animate.css -->
    <link th:href="@{/webjars/animate.css/4.1.1/animate.min.css}" rel="stylesheet"/>
    
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .login-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            max-width: 400px;
            width: 100%;
        }
        
        .login-header {
            background: linear-gradient(135deg, #4F46E5 0%, #6366f1 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .login-body {
            padding: 40px 30px;
        }
        
        .btn-login {
            background: linear-gradient(135deg, #4F46E5 0%, #6366f1 100%);
            border: none;
            border-radius: 25px;
            padding: 12px;
            font-weight: 600;
            transition: transform 0.2s;
        }
        
        .btn-login:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #3730a3 0%, #4f46e5 100%);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="login-card animate__animated animate__fadeInUp">
                    <div class="login-header">
                        <i class="bi bi-gift-fill" style="font-size: 3rem;"></i>
                        <h3 class="mt-3">欢迎回来</h3>
                        <p class="mb-0">登录家庭积分系统</p>
                    </div>
                    
                    <form class="login-body" method="post" action="/login">
                        <div class="mb-3">
                            <label for="username" class="form-label">
                                <i class="bi bi-person"></i> 用户名
                            </label>
                            <input type="text" class="form-control" id="username" name="username" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="password" class="form-label">
                                <i class="bi bi-lock"></i> 密码
                            </label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-login">
                                <i class="bi bi-box-arrow-in-right"></i> 登录
                            </button>
                        </div>
                        
                        <div class="text-center mt-3">
                            <small class="text-muted">
                                <i class="bi bi-info-circle"></i> 还没有账号？
                                <a th:href="@{/register}" class="text-decoration-none fw-semibold">立即注册</a>
                            </small>
                        </div>
                        
                        <!-- Success message after registration -->
                        <div th:if="${success}" class="alert alert-success mt-3 animate__animated animate__fadeIn" role="alert">
                            <i class="bi bi-check-circle-fill"></i>
                            <span th:text="${success}">注册成功！</span>
                        </div>
                        
                        <!-- Error message -->
                        <div th:if="${param.error}" class="alert alert-danger mt-3 animate__animated animate__shakeX" role="alert">
                            <i class="bi bi-exclamation-triangle-fill"></i>
                            <strong>登录失败</strong><br>
                            <small>用户名或密码错误，请检查后重试。</small><br>
                            <small class="text-muted"></small>
                        </div>
                        
                        <!-- Logout message -->
                        <div th:if="${param.logout}" class="alert alert-info mt-3 animate__animated animate__fadeIn" role="alert">
                            <i class="bi bi-info-circle-fill"></i>
                            您已成功退出登录
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script th:src="@{/webjars/bootstrap/5.3.3/dist/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
