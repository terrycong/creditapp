<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的反馈 - 家庭积分系统</title>
    <link href="/webjars/bootstrap/5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px 0;
        }
        .feedback-container {
            max-width: 900px;
            margin: 0 auto;
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .card-header {
            background: linear-gradient(135deg, #4F46E5 0%, #6366f1 100%);
            color: white;
            border-radius: 15px 15px 0 0 !important;
            padding: 20px;
        }
        .feedback-item {
            border-left: 4px solid #6366f1;
            transition: transform 0.2s;
        }
        .feedback-item:hover {
            transform: translateX(5px);
        }
        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }
        .status-pending { background-color: #fef3c7; color: #92400e; }
        .status-reviewed { background-color: #dbeafe; color: #1e40af; }
        .status-accepted { background-color: #d1fae5; color: #065f46; }
        .status-rejected { background-color: #fee2e2; color: #991b1b; }
        .category-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            background-color: #f3f4f6;
            color: #374151;
        }
        .response-box {
            background-color: #f0f9ff;
            border-left: 4px solid #0ea5e9;
            padding: 15px;
            margin-top: 15px;
            border-radius: 5px;
        }
        .btn-submit {
            background: linear-gradient(135deg, #4F46E5 0%, #6366f1 100%);
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: 600;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(79, 70, 229, 0.4);
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
        }
        .empty-state i {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="container feedback-container">
        <!-- 返回按钮 -->
        <div class="mb-3">
            <a href="/dashboard" class="btn btn-outline-light">
                <i class="bi bi-arrow-left"></i> 返回主页
            </a>
        </div>

        <!-- 提交新反馈 -->
        <div class="card">
            <div class="card-header">
                <h4 class="mb-0"><i class="bi bi-chat-dots"></i> 提交新反馈</h4>
            </div>
            <div class="card-body p-4">
                <form id="feedbackForm">
                    <div class="mb-3">
                        <label class="form-label"><i class="bi bi-tag"></i> 反馈类型</label>
                        <select class="form-select" id="category" required>
                            <option value="">请选择类型...</option>
                            <option value="FUNCTIONAL">💡 功能建议</option>
                            <option value="NON_FUNCTIONAL">🎨 非功能建议</option>
                            <option value="OTHER">💬 其他</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label"><i class="bi bi-card-heading"></i> 标题</label>
                        <input type="text" class="form-control" id="title" 
                               placeholder="简短描述你的想法" maxlength="200" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label"><i class="bi bi-card-text"></i> 详细描述</label>
                        <textarea class="form-control" id="description" rows="4" 
                                  placeholder="请详细描述你的建议或想法..." required></textarea>
                    </div>
                    <div class="text-end">
                        <button type="submit" class="btn btn-primary btn-submit">
                            <i class="bi bi-send"></i> 提交反馈
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- 我的反馈历史 -->
        <div class="card">
            <div class="card-header">
                <h4 class="mb-0"><i class="bi bi-clock-history"></i> 我的反馈历史</h4>
            </div>
            <div class="card-body p-4">
                <div id="feedbackList">
                    <!-- 反馈列表将通过 JavaScript 加载 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 成功提示 Modal -->
    <div class="modal fade" id="successModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title"><i class="bi bi-check-circle"></i> 提交成功</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>你的反馈已成功提交，家长会在审核后回复你！</p>
                </div>
            </div>
        </div>
    </div>

    <script src="/webjars/bootstrap/5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/webjars/axios/1.6.0/dist/axios.min.js"></script>
    <script>
        // CSRF Token
        const csrfToken = document.querySelector('meta[name="_csrf"]')?.content || '';
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]')?.content || 'X-XSRF-TOKEN';

        // 加载反馈列表
        async function loadFeedbacks() {
            try {
                const response = await axios.get('/api/feedback/my');
                const feedbacks = response.data;
                
                const container = document.getElementById('feedbackList');
                
                if (feedbacks.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="bi bi-inbox"></i>
                            <h5>还没有反馈</h5>
                            <p>提交你的第一个反馈吧！</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = feedbacks.map(f => `
                    <div class="card feedback-item mb-3">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <h5 class="card-title mb-1">${escapeHtml(f.title)}</h5>
                                <span class="status-badge status-${f.status.toLowerCase()}">
                                    ${f.statusDisplay || f.status}
                                </span>
                            </div>
                            <div class="mb-2">
                                <span class="category-badge">
                                    <i class="bi bi-tag"></i> ${f.categoryDisplay || f.category}
                                </span>
                                <small class="text-muted ms-2">
                                    <i class="bi bi-clock"></i> ${formatDate(f.createdAt)}
                                </small>
                            </div>
                            <p class="card-text text-muted">${escapeHtml(f.description)}</p>
                            ${f.parentResponse ? `
                                <div class="response-box">
                                    <strong><i class="bi bi-person"></i> 家长回复：</strong>
                                    <p class="mb-0 mt-2">${escapeHtml(f.parentResponse)}</p>
                                    <small class="text-muted">
                                        <i class="bi bi-clock"></i> ${formatDate(f.respondedAt)}
                                    </small>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('加载反馈失败:', error);
            }
        }

        // 提交反馈
        document.getElementById('feedbackForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                category: document.getElementById('category').value,
                title: document.getElementById('title').value,
                description: document.getElementById('description').value
            };

            try {
                await axios.post('/api/feedback/submit', formData);
                
                // 显示成功提示
                const modal = new bootstrap.Modal(document.getElementById('successModal'));
                modal.show();
                
                // 重置表单
                document.getElementById('feedbackForm').reset();
                
                // 重新加载列表
                setTimeout(() => loadFeedbacks(), 500);
            } catch (error) {
                alert('提交失败，请重试');
                console.error('提交失败:', error);
            }
        });

        // 工具函数
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDate(dateString) {
            if (!dateString) return '';
            const date = new Date(dateString);
            return date.toLocaleString('zh-CN', { 
                year: 'numeric', 
                month: '2-digit', 
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // 页面加载时获取反馈列表
        loadFeedbacks();
    </script>
</body>
</html>
