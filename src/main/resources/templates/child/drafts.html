<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的草稿任务 - 家庭积分系统</title>
    
    <!-- Bootstrap 5 CSS (WebJars) -->
    <link th:href="@{/webjars/bootstrap/5.3.3/dist/css/bootstrap.min.css}" rel="stylesheet">
    <!-- Bootstrap Icons (WebJars) -->
    <link th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.css}" rel="stylesheet">
    <!-- Animate.css (WebJars) -->
    <link th:href="@{/webjars/animate.css/4.1.1/animate.min.css}" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #4F46E5;
            --success-color: #10B981;
            --warning-color: #F59E0B;
            --danger-color: #EF4444;
            --info-color: #3B82F6;
        }
        
        body {
            background-color: #f8f9fa;
        }
        
        .navbar-brand {
            font-weight: bold;
            color: var(--primary-color) !important;
        }
        
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }
        
        .task-card {
            transition: transform 0.2s;
        }
        
        .task-card:hover {
            transform: translateY(-5px);
        }
        
        .points-badge {
            background: linear-gradient(135deg, var(--success-color), #34D399);
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="/dashboard">
                <i class="bi bi-gift-fill"></i> 家庭积分系统
            </a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/dashboard">
                            <i class="bi bi-house-door"></i> 首页
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/child/tasks">
                            <i class="bi bi-list-check"></i> 我的任务
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/child/rewards">
                            <i class="bi bi-gift"></i> 礼物商城
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/child/points/history">
                            <i class="bi bi-graph-up"></i> 积分历史
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/child/wallet">
                            <i class="bi bi-wallet2"></i> 积分钱包
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/login">
                            <i class="bi bi-box-arrow-right"></i> 退出
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row mb-4">
            <div class="col-12">
                <h1 class="section-title animate__animated animate__fadeInLeft">
                    <i class="bi bi-file-earmark-medical"></i> 我的草稿任务
                </h1>
                <p class="text-muted">查看你创建的草稿任务，等待家长审批</p>
            </div>
        </div>

        <!-- Draft Tasks -->
        <div class="row animate__animated animate__fadeInUp">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-info text-white">
                        <h5 class="mb-0">
                            <i class="bi bi-clock-history"></i> 待审批的草稿任务
                        </h5>
                    </div>
                    <div class="card-body">
                        <!-- Success/Error Messages -->
                        <div th:if="${success}" class="alert alert-success animate__animated animate__fadeIn">
                            <i class="bi bi-check-circle"></i> <span th:text="${success}"></span>
                        </div>
                        <div th:if="${error}" class="alert alert-danger animate__animated animate__fadeIn">
                            <i class="bi bi-exclamation-circle"></i> <span th:text="${error}"></span>
                        </div>

                        <!-- Empty state -->
                        <div th:if="${draftTasks == null or draftTasks.isEmpty()}" class="text-center py-5">
                            <div class="mb-3">
                                <i class="bi bi-inbox" style="font-size: 4rem; color: #d1d5db;"></i>
                            </div>
                            <h5 class="text-muted">暂时没有草稿任务</h5>
                            <p class="text-muted">在"我的任务"页面可以创建新的草稿任务</p>
                            <a href="/child/tasks" class="btn btn-primary mt-3">
                                <i class="bi bi-plus-circle"></i> 去创建任务
                            </a>
                        </div>

                        <!-- Draft task list -->
                        <div th:if="${draftTasks != null and !draftTasks.isEmpty()}" class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>任务标题</th>
                                        <th>描述</th>
                                        <th>期望积分</th>
                                        <th>类型</th>
                                        <th>状态</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="task : ${draftTasks}">
                                        <td th:text="${task.title}">任务标题</td>
                                        <td th:text="${task.description}">任务描述</td>
                                        <td>
                                            <span class="badge bg-warning" th:text="${task.points + ' 积分'}">10 积分</span>
                                        </td>
                                        <td>
                                            <span th:classappend="${(task.type == 'ONE_TIME') ? 'bg-secondary' : (task.type == 'REPEATABLE') ? 'bg-warning' : 'bg-info'}"
                                                  class="badge"
                                                  th:text="${(task.type == 'ONE_TIME') ? '一次性' : (task.type == 'REPEATABLE') ? '可重复' : '每日一次'}">
                                                任务类型
                                            </span>
                                        </td>
                                        <td>
                                            <span class="badge bg-info">等待审批</span>
                                        </td>
                                        <td>
                                            <form th:action="@{/child/drafts/{id}/withdraw(id=${task.id})}" method="post" style="display:inline;"
                                                  onsubmit="return confirm('确定要撤回这个草稿任务吗？删除后无法恢复。');">
                                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                                    <i class="bi bi-trash"></i> 撤回删除
                                                </button>
                                            </form>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-12 text-center">
                <a href="/child/tasks" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i> 返回任务列表
                </a>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-3 mt-5">
        <div class="container">
            <p>&copy; 2024 家庭积分系统. 让爱与陪伴一起成长！</p>
        </div>
    </footer>

    <!-- Bootstrap JS (WebJars) -->
    <script th:src="@{/webjars/bootstrap/5.3.3/dist/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
