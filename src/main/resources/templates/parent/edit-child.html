<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'编辑 - ' + ${child.username}">编辑小孩信息 - 家庭积分系统</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    
    <style>
        :root {
            --primary-color: #4F46E5;
            --success-color: #10B981;
            --warning-color: #F59E0B;
            --danger-color: #EF4444;
            --info-color: #3B82F6;
        }
        
        body {
            background-color: #f8f9fa;
        }
        
        .navbar-brand {
            font-weight: bold;
            color: var(--primary-color) !important;
        }
        
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }
        
        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.25rem rgba(79, 70, 229, 0.25);
        }
        
        .section-title {
            color: #374151;
            font-weight: 600;
            margin-bottom: 20px;
        }
        
        .child-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="/dashboard">
                <i class="bi bi-gift-fill"></i> 家庭积分系统
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/dashboard">
                            <i class="bi bi-house-door"></i> 首页
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/parent/tasks">
                            <i class="bi bi-list-check"></i> 任务管理
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/parent/rewards">
                            <i class="bi bi-gift"></i> 礼物管理
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/parent/children">
                            <i class="bi bi-people"></i> 小孩管理
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/login">
                            <i class="bi bi-box-arrow-right"></i> 退出
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <!-- Back Button -->
        <div class="row mb-4">
            <div class="col-12">
                <a th:href="@{/parent/children/{childId}(childId=${child.id})}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i> 返回详情
                </a>
            </div>
        </div>

        <!-- Error/Success Messages -->
        <div th:if="${param.error}" class="row mb-4">
            <div class="col-12">
                <div class="alert alert-danger animate__animated animate__shakeX">
                    <i class="bi bi-exclamation-triangle-fill"></i>
                    <span th:text="${param.error}">错误信息</span>
                </div>
            </div>
        </div>
        
        <div th:if="${param.success}" class="row mb-4">
            <div class="col-12">
                <div class="alert alert-success animate__animated animate__fadeIn">
                    <i class="bi bi-check-circle-fill"></i>
                    <span th:text="${param.success}">成功信息</span>
                </div>
            </div>
        </div>

        <!-- Edit Form -->
        <div class="row animate__animated animate__fadeIn">
            <div class="col-md-8 mx-auto">
                <div class="card">
                    <div class="card-header bg-warning text-white">
                        <h5 class="mb-0">
                            <i class="bi bi-pencil"></i> 编辑小孩信息
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="text-center mb-4">
                            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?ixlib=rb-4.0.3&auto=format&fit=crop&w=400&q=80" 
                                 class="child-avatar mb-3" alt="child">
                            <h4 th:text="${child.username}">小孩姓名</h4>
                            <p class="text-muted">当前积分：<span th:text="${child.points}">0</span></p>
                        </div>
                        
                        <form th:action="@{/parent/children/{childId}/update(childId=${child.id})}" method="post">
                            <!-- Username -->
                            <div class="mb-3">
                                <label for="username" class="form-label">
                                    <i class="bi bi-person"></i> 用户名
                                </label>
                                <input type="text" 
                                       class="form-control" 
                                       id="username" 
                                       name="username"
                                       th:value="${child.username}"
                                       placeholder="输入新的用户名">
                                <div class="form-text">
                                    如果不修改用户名，请留空
                                </div>
                            </div>
                            
                            <!-- Password -->
                            <div class="mb-3">
                                <label for="password" class="form-label">
                                    <i class="bi bi-lock"></i> 密码
                                </label>
                                <input type="password" 
                                       class="form-control" 
                                       id="password" 
                                       name="password"
                                       placeholder="输入新密码">
                                <div class="form-text">
                                    如果不修改密码，请留空
                                </div>
                            </div>
                            
                            <!-- Confirm Password -->
                            <div class="mb-3">
                                <label for="confirmPassword" class="form-label">
                                    <i class="bi bi-lock-fill"></i> 确认密码
                                </label>
                                <input type="password" 
                                       class="form-control" 
                                       id="confirmPassword" 
                                       name="confirmPassword"
                                       placeholder="再次输入新密码">
                            </div>
                            
                            <!-- Points -->
                            <div class="mb-4">
                                <label for="points" class="form-label">
                                    <i class="bi bi-cash-stack"></i> 积分
                                </label>
                                <input type="number" 
                                       class="form-control" 
                                       id="points" 
                                       name="points"
                                       th:value="${child.points}"
                                       min="0"
                                       placeholder="设置积分">
                                <div class="form-text">
                                    设置小孩的当前积分
                                </div>
                            </div>
                            
                            <!-- Form Actions -->
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-warning">
                                    <i class="bi bi-check-circle"></i> 保存更改
                                </button>
                                <a th:href="@{/parent/children/{childId}(childId=${child.id})}" 
                                   class="btn btn-outline-secondary">
                                    <i class="bi bi-x-circle"></i> 取消
                                </a>
                            </div>
                        </form>
                        
                        <!-- Danger Zone -->
                        <div class="mt-5 pt-4 border-top">
                            <h6 class="text-danger mb-3">
                                <i class="bi bi-exclamation-triangle-fill"></i> 危险操作
                            </h6>
                            <form th:action="@{/parent/children/{childId}/delete(childId=${child.id})}" 
                                  method="post" 
                                  onsubmit="return confirm('确定要删除这个小孩账号吗？此操作不可撤销！所有相关数据将被删除！');">
                                <button type="submit" class="btn btn-danger w-100">
                                    <i class="bi bi-trash"></i> 删除账号
                                </button>
                                <div class="form-text text-danger mt-2">
                                    警告：删除账号将永久删除所有相关数据，包括任务记录和兑换记录。
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-3 mt-5">
        <div class="container">
            <p>&copy; 2024 家庭积分系统. 让爱与陪伴一起成长！</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Password Confirmation Script -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.querySelector('form');
            const password = document.getElementById('password');
            const confirmPassword = document.getElementById('confirmPassword');
            
            form.addEventListener('submit', function(event) {
                if (password.value !== confirmPassword.value) {
                    event.preventDefault();
                    alert('密码和确认密码不匹配！');
                    password.focus();
                }
            });
        });
    </script>
</body>
</html>
