<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务审批 - 家庭积分系统</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    
    <style>
        :root {
            --primary-color: #4F46E5;
            --success-color: #10B981;
            --warning-color: #F59E0B;
            --danger-color: #EF4444;
            --info-color: #3B82F6;
        }
        
        body {
            background-color: #f8f9fa;
        }
        
        .navbar-brand {
            font-weight: bold;
            color: var(--primary-color) !important;
        }
        
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }
        
        .section-title {
            color: #374151;
            font-weight: 600;
            margin-bottom: 20px;
        }
        
        .points-badge {
            background: linear-gradient(135deg, var(--success-color), #34D399);
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
        }
        
        .badge-pending {
            background: linear-gradient(135deg, var(--warning-color), #FBBF24);
        }
        
        .badge-approved {
            background: linear-gradient(135deg, var(--success-color), #34D399);
        }
        
        .badge-rejected {
            background: linear-gradient(135deg, var(--danger-color), #F87171);
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="/dashboard">
                <i class="bi bi-gift-fill"></i> 家庭积分系统
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/dashboard">
                            <i class="bi bi-house-door"></i> 首页
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/parent/tasks">
                            <i class="bi bi-list-check"></i> 任务管理
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/parent/rewards">
                            <i class="bi bi-gift"></i> 礼物管理
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/parent/approvals">
                            <i class="bi bi-check-circle"></i> 任务审批
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/parent/children">
                            <i class="bi bi-people"></i> 小孩管理
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/login">
                            <i class="bi bi-box-arrow-right"></i> 退出
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
 
    <div class="container mt-4">
        <div class="row mb-4">
            <div class="col-12">
                <h1 class="section-title animate__animated animate__fadeInLeft">
                    <i class="bi bi-check-circle"></i> 任务审批
                </h1>
                <p class="text-muted">审核小孩提交的任务完成记录，批准后发放积分奖励</p>
            </div>
        </div>
 
        <!-- Success/Error Messages -->
        <div th:if="${success}" class="row mb-4 animate__animated animate__fadeIn">
            <div class="col-12">
                <div class="alert alert-success">
                    <i class="bi bi-check-circle-fill"></i> <span th:text="${success}"></span>
                </div>
            </div>
        </div>
        
        <div th:if="${error}" class="row mb-4 animate__animated animate__shakeX">
            <div class="col-12">
                <div class="alert alert-danger">
                    <i class="bi bi-exclamation-triangle-fill"></i> <span th:text="${error}"></span>
                </div>
            </div>
        </div>
 
        <!-- Pending Completions -->
        <div class="row animate__animated animate__fadeInUp">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">
                            <i class="bi bi-hourglass-split"></i> 待审批任务
                            <span class="badge bg-warning ms-2" th:text="${pendingCompletions != null ? pendingCompletions.size() : 0} + ' 个'">0 个</span>
                        </h5>
                    </div>
                    <div class="card-body">
                        <!-- Empty state -->
                        <div th:if="${pendingCompletions == null or pendingCompletions.isEmpty()}" class="text-center py-5">
                            <i class="bi bi-inbox" style="font-size: 3rem; color: #6c757d;"></i>
                            <p class="mt-3 mb-0 text-muted">暂无待审批任务</p>
                            <p class="text-muted">当小孩完成任务后，会在这里显示审批请求</p>
                        </div>
                        
                        <!-- Pending completions table -->
                        <div th:if="${pendingCompletions != null and !pendingCompletions.isEmpty()}">
                            <div class="table-responsive">
                                <table class="table table-hover">
                                    <thead>
                                        <tr>
                                            <th>任务标题</th>
                                            <th>小孩</th>
                                            <th>积分奖励</th>
                                            <th>完成时间</th>
                                            <th>证明</th>
                                            <th>操作</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="completion : ${pendingCompletions}">
                                            <td>
                                                <strong th:text="${completion.taskTitle}">任务标题</strong>
                                            </td>
                                            <td th:text="${completion.childName}">child</td>
                                            <td>
                                                <span class="badge points-badge" th:text="${completion.taskPoints} + ' 积分'">
                                                    10 积分
                                                </span>
                                            </td>
                                            <td th:text="${#temporals.format(completion.completedAt, 'yyyy-MM-dd HH:mm')}">2024-01-01 12:00</td>
                                            <td>
                                                <span th:if="${completion.proof != null and !completion.proof.isEmpty()}" class="badge bg-info">
                                                    <i class="bi bi-image"></i> 有图片
                                                </span>
                                                <span th:if="${completion.proof == null or completion.proof.isEmpty()}" class="text-muted">
                                                    <i class="bi bi-dash"></i> 无
                                                </span>
                                            </td>
                                            <td>
                                                <form th:action="@{/parent/approvals/{completionId}/approve(completionId=${completion.id})}" method="post" style="display:inline;">
                                                    <button type="submit" class="btn btn-sm btn-success me-1" title="批准">
                                                        <i class="bi bi-check-circle"></i> 批准
                                                    </button>
                                                </form>
                                                <form th:action="@{/parent/approvals/{completionId}/reject(completionId=${completion.id})}" method="post" style="display:inline;"
                                                      onsubmit="return confirm('确定要拒绝这个任务完成吗？');">
                                                    <button type="submit" class="btn btn-sm btn-danger" title="拒绝">
                                                        <i class="bi bi-x-circle"></i> 拒绝
                                                    </button>
                                                </form>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
 
    <footer class="bg-dark text-white text-center py-3 mt-5">
        <div class="container">
            <p>&copy; 2024 家庭积分系统. 让爱与陪伴一起成长！</p>
        </div>
    </footer>
 
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
