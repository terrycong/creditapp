<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>礼物管理 - 家庭积分系统</title>
    
    <!-- Bootstrap 5 CSS -->
    <link th:href="@{/webjars/bootstrap/5.3.3/dist/css/bootstrap.min.css}" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.css}" rel="stylesheet">
    <!-- Animate.css -->
    <link th:href="@{/webjars/animate.css/4.1.1/animate.min.css}" rel="stylesheet"/>
    
    <style>
        :root {
            --primary-color: #4F46E5;
            --success-color: #10B981;
            --warning-color: #F59E0B;
            --danger-color: #EF4444;
            --info-color: #3B82F6;
        }
        
        body {
            background-color: #f8f9fa;
        }
        
        .navbar-brand {
            font-weight: bold;
            color: var(--primary-color) !important;
        }
        
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }
        
        .reward-card {
            transition: transform 0.2s;
            height: 100%;
        }
        
        .reward-card:hover {
            transform: translateY(-5px);
        }
        
        .reward-image {
            height: 200px;
            object-fit: cover;
            border-radius: 10px 10px 0 0;
        }
        
        .points-badge {
            background: linear-gradient(135deg, var(--warning-color), #FBBF24);
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
        }
        
        .section-title {
            color: #374151;
            font-weight: 600;
            margin-bottom: 20px;
        }
        
        .quantity-badge {
            background-color: var(--info-color);
            color: white;
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="/dashboard">
                <i class="bi bi-gift-fill"></i> 家庭积分系统
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/dashboard">
                            <i class="bi bi-house-door"></i> 首页
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/parent/tasks">
                            <i class="bi bi-list-check"></i> 任务管理
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/parent/marketplace">
                            <i class="bi bi-shop"></i> 任务市场
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/parent/rewards">
                            <i class="bi bi-gift"></i> 礼物管理
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/parent/approvals">
                            <i class="bi bi-check-circle"></i> 任务审批
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/parent/children">
                            <i class="bi bi-people"></i> 小孩管理
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/parent/children">
                            <i class="bi bi-people"></i> 小孩管理
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/login">
                            <i class="bi bi-box-arrow-right"></i> 退出
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row mb-4">
            <div class="col-12">
                <h1 class="section-title animate__animated animate__fadeInLeft">
                    <i class="bi bi-gift"></i> 礼物管理
                </h1>
                <p class="text-muted">为小孩设置可兑换的礼物，激励他们完成任务</p>
            </div>
        </div>

        <!-- Create Reward Form -->
        <div class="row mb-5 animate__animated animate__fadeInUp">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0">
                            <i class="bi bi-plus-circle"></i> 添加新礼物
                        </h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/parent/rewards}" method="post">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="name" class="form-label">礼物名称</label>
                                    <input type="text" class="form-control" id="name" name="name" 
                                           placeholder="例如：游戏时间" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="pointsRequired" class="form-label">所需积分</label>
                                    <input type="number" class="form-control" id="pointsRequired" name="pointsRequired" 
                                           min="1" max="10000" value="20" required>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="quantity" class="form-label">库存数量</label>
                                    <input type="number" class="form-control" id="quantity" name="quantity" 
                                           min="1" max="999" value="999">
                                    <div class="form-text">999表示无限库存</div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="imageUrl" class="form-label">图片URL（可选）</label>
                                    <input type="url" class="form-control" id="imageUrl" name="imageUrl" 
                                           placeholder="https://example.com/image.jpg">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="description" class="form-label">礼物描述</label>
                                <textarea class="form-control" id="description" name="description" 
                                          rows="3" placeholder="详细描述礼物内容..."></textarea>
                            </div>
                             <button type="submit" class="btn btn-success">
                                <i class="bi bi-check-circle"></i> 添加礼物
                            </button>
                        </form>
                        
                        <!-- Success/Error Messages -->
                        <div th:if="${success}" class="alert alert-success mt-3 animate__animated animate__fadeIn">
                            <i class="bi bi-check-circle"></i> <span th:text="${success}"></span>
                        </div>
                        <div th:if="${error}" class="alert alert-danger mt-3 animate__animated animate__fadeIn">
                            <i class="bi bi-exclamation-circle"></i> <span th:text="${error}"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Rewards Grid -->
        <div class="row animate__animated animate__fadeInUp">
            <div class="col-12 mb-4">
                <h5 class="section-title">
                    <i class="bi bi-gift-fill"></i> 现有礼物
                </h5>
            </div>
            
            <div th:each="reward : ${rewards}" class="col-md-4 mb-4">
                <div class="card reward-card">
                    <img th:src="${reward.imageUrl} ?: 'https://images.unsplash.com/photo-1550745165-9bc0b252726f?ixlib=rb-4.0.3&auto=format&fit=crop&w=600&q=80'" 
                         class="card-img-top reward-image" th:alt="${reward.name}">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${reward.name}">礼物名称</h5>
                        <p class="card-text text-muted" th:text="${reward.description} ?: '暂无描述'">礼物描述</p>
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="badge points-badge" th:text="${reward.pointsRequired} + ' 积分'">
                                20 积分
                            </span>
                            <span th:classappend="${reward.quantity == 999} ? 'badge quantity-badge' : 'badge bg-warning'"
                                  th:text="${reward.quantity == 999} ? '无限库存' : ${reward.quantity} + ' 库存'">
                                库存
                            </span>
                        </div>
                        <div class="mt-3">
                            <button class="btn btn-sm btn-outline-primary w-100 mb-2" disabled>
                                <i class="bi bi-pencil"></i> 编辑
                            </button>
                            <form th:action="@{/parent/rewards/{id}/delete(id=${reward.id})}" 
                                  method="post" 
                                  onsubmit="return confirm('确定要删除这个礼物吗？此操作不可撤销！');"
                                  class="d-grid">
                                <button type="submit" class="btn btn-sm btn-outline-danger w-100">
                                    <i class="bi bi-trash"></i> 删除
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
            
            <div th:if="${#lists.isEmpty(rewards)}" class="col-12">
                <div class="alert alert-info text-center">
                    <i class="bi bi-inbox"></i> 暂无礼物，请添加第一个礼物
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-3 mt-5">
        <div class="container">
            <p>&copy; 2024 家庭积分系统. 让爱与陪伴一起成长！</p>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script th:src="@{/webjars/bootstrap/5.3.3/dist/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
