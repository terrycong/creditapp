<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>通知管理 - 家庭积分系统</title>
    
    <link th:href="@{/webjars/bootstrap/5.3.3/dist/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.css}" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #4F46E5;
            --success-color: #10B981;
            --warning-color: #F59E0B;
            --danger-color: #EF4444;
        }
        
        body { background-color: #f8f9fa; }
        
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }
        
        .priority-URGENT { border-left: 4px solid #EF4444; }
        .priority-HIGH { border-left: 4px solid #F59E0B; }
        .priority-NORMAL { border-left: 4px solid #3B82F6; }
        .priority-LOW { border-left: 4px solid #10B981; }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="/dashboard">
                <i class="bi bi-gift-fill"></i> 家庭积分系统
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/dashboard"><i class="bi bi-house-door"></i> 首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/parent/notifications"><i class="bi bi-bell"></i> 通知管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/login"><i class="bi bi-box-arrow-right"></i> 退出</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row mb-4">
            <div class="col-12">
                <h1 class="section-title">
                    <i class="bi bi-bell"></i> 通知管理
                </h1>
                <p class="text-muted">发布通知给小孩，重要消息及时传达</p>
            </div>
        </div>

        <!-- Create Notification Form -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0"><i class="bi bi-plus-circle"></i> 发布新通知</h5>
                        <button class="btn btn-sm btn-light" type="button" data-bs-toggle="collapse" data-bs-target="#createNotificationForm">
                            <i class="bi bi-chevron-down"></i> 展开/收起
                        </button>
                    </div>
                    <div class="card-body collapse" id="createNotificationForm">
                        <form id="createNotificationFormEl">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="notificationTitle" class="form-label">标题</label>
                                    <input type="text" class="form-control" id="notificationTitle" required>
                                </div>
                                <div class="col-md-3 mb-3">
                                    <label for="notificationPriority" class="form-label">优先级</label>
                                    <select class="form-select" id="notificationPriority">
                                        <option value="LOW">低</option>
                                        <option value="NORMAL" selected>普通</option>
                                        <option value="HIGH">高</option>
                                        <option value="URGENT">紧急</option>
                                    </select>
                                </div>
                                <div class="col-md-3 mb-3">
                                    <label for="notificationTargetType" class="form-label">发送对象</label>
                                    <select class="form-select" id="notificationTargetType">
                                        <option value="ALL">所有小孩</option>
                                        <option value="SPECIFIC_CHILD">指定小孩</option>
                                    </select>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="notificationContent" class="form-label">内容</label>
                                <textarea class="form-control" id="notificationContent" rows="3" required></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-send"></i> 发布通知
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Notifications List -->
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header bg-success text-white">
                        <h5 class="mb-0"><i class="bi bi-list-task"></i> 通知历史</h5>
                    </div>
                    <div class="card-body">
                        <div th:if="${#lists.isEmpty(notifications)}" class="text-center py-5">
                            <i class="bi bi-inbox" style="font-size: 4rem; color: #d1d5db;"></i>
                            <h5 class="text-muted mt-3">暂时没有通知</h5>
                        </div>
                        <div th:if="${!#lists.isEmpty(notifications)}" class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>优先级</th>
                                        <th>标题</th>
                                        <th>内容</th>
                                        <th>发送对象</th>
                                        <th>发布时间</th>
                                        <th>状态</th>
                                        <th>操作</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="notif : ${notifications}" th:class="'priority-' + ${notif.priority}">
                                        <td>
                                            <span class="badge" 
                                                  th:class="${notif.priority == 'URGENT'} ? 'bg-danger' : 
                                                             (${notif.priority == 'HIGH'} ? 'bg-warning' : 
                                                             (${notif.priority == 'LOW'} ? 'bg-success' : 'bg-info'))"
                                                  th:text="${notif.priority == 'URGENT'} ? '紧急' : 
                                                           (${notif.priority == 'HIGH'} ? '高' : 
                                                           (${notif.priority == 'LOW'} ? '低' : '普通'))">
                                            </span>
                                        </td>
                                        <td><strong th:text="${notif.title}">标题</strong></td>
                                        <td><span class="text-muted" th:text="${#strings.abbreviate(notif.content, 50)}">内容</span></td>
                                        <td>
                                            <span th:if="${notif.targetType == 'ALL'}">所有小孩</span>
                                            <span th:if="${notif.targetType == 'SPECIFIC_CHILD'}">指定小孩</span>
                                        </td>
                                        <td th:text="${#temporals.format(notif.createdAt, 'yyyy-MM-dd HH:mm')}">时间</td>
                                        <td>
                                            <span th:if="${notif.active}" class="badge bg-success">启用</span>
                                            <span th:unless="${notif.active}" class="badge bg-secondary">已停用</span>
                                        </td>
                                        <td>
                                            <button class="btn btn-sm btn-danger delete-notif-btn" 
                                                    th:data-notif-id="${notif.id}">
                                                <i class="bi bi-trash"></i> 删除
                                            </button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/webjars/bootstrap/5.3.3/dist/js/bootstrap.bundle.min.js}"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Create notification form
            document.getElementById('createNotificationFormEl').addEventListener('submit', function(e) {
                e.preventDefault();
                
                const data = {
                    title: document.getElementById('notificationTitle').value,
                    content: document.getElementById('notificationContent').value,
                    priority: document.getElementById('notificationPriority').value,
                    targetType: document.getElementById('notificationTargetType').value
                };
                
                fetch('/api/v1/notifications', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                })
                .then(response => response.json())
                .then(data => {
                    if (data.code === 'SUCCESS') {
                        alert('通知发布成功！');
                        window.location.reload();
                    } else {
                        alert('发布失败：' + data.message);
                    }
                })
                .catch(error => alert('发布失败：' + error));
            });
            
            // Delete notification
            document.querySelectorAll('.delete-notif-btn').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    if (confirm('确定删除此通知吗？')) {
                        const notifId = this.getAttribute('data-notif-id');
                        fetch('/api/v1/notifications/' + notifId, { method: 'DELETE' })
                        .then(response => response.json())
                        .then(data => {
                            if (data.code === 'SUCCESS') {
                                alert('通知已删除');
                                window.location.reload();
                            } else {
                                alert('删除失败：' + data.message);
                            }
                        });
                    }
                });
            });
        });
    </script>
</body>
</html>
