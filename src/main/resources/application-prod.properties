# ===================================================================
# Production Profile Configuration
# Credit Points Application - Production Environment
# ===================================================================
# Usage:
#   mvn spring-boot:run -Dspring-boot.run.profiles=prod
#   java -jar target/credit-app-1.0.0.jar --spring.profiles.active=prod
# ===================================================================

# Application Configuration
spring.application.name=credit-app-prod
server.port=${PORT:8080}

# ===================================================================
# Database Configuration - MySQL (Production)
# ===================================================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${MYSQL_URL:jdbc:mysql://192.168.9.113:3306/creditapp?useSSL=true&allowPublicKeyRetrieval=false&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:123456}

# Connection Pool Configuration (HikariCP)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1

# MySQL Performance Optimizations
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048
spring.datasource.hikari.data-source-properties.useServerPrepStmts=true
spring.datasource.hikari.data-source-properties.useLocalSessionState=true
spring.datasource.hikari.data-source-properties.rewriteBatchedStatements=true
spring.datasource.hikari.data-source-properties.cacheResultSetMetadata=true
spring.datasource.hikari.data-source-properties.cacheServerConfiguration=true

# JPA Configuration for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Liquibase Configuration
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-mysql.yaml

# SQL Data Initialization (handled by Liquibase)
spring.sql.init.mode=never
spring.sql.init.enabled=false

# H2 Console - DISABLED in production
spring.h2.console.enabled=false

# ===================================================================
# Thymeleaf Configuration (Production - Enable Cache)
# ===================================================================
spring.thymeleaf.cache=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.check-template-location=true

# ===================================================================
# Logging Configuration (Production - Less Verbose)
# ===================================================================
logging.level.com.creditapp=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Log file configuration
logging.file.name=logs/creditapp.log
logging.file.max-size=10MB
logging.file.max-history=30
logging.file.total-size-cap=100MB

# ===================================================================
# Server Configuration (Production - Secure)
# ===================================================================
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css

# HTTPS Configuration (Enable in production with valid SSL certificate)
# server.ssl.enabled=true
# server.ssl.key-store=classpath:keystore.p12
# server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:}
# server.ssl.key-store-type=PKCS12
# server.ssl.key-alias=creditapp

# ===================================================================
# Security Configuration (Production)
# ===================================================================
spring.security.csrf.enabled=false

# CORS Configuration (Configure for your domain)
# spring.web.cors.allowed-origins=https://your-domain.com
# spring.web.cors.allowed-methods=GET,POST,PUT,DELETE
# spring.web.cors.allowed-headers=*
# spring.web.cors.allow-credentials=true

# ===================================================================
# Production Features
# ===================================================================
creditapp.development-mode=false
creditapp.show-sql-queries=false
creditapp.enable-test-data=false

# Feature settings
creditapp.marketplace.enabled=true
creditapp.marketplace.max-tasks-per-child=10
creditapp.task.daily-limit-check=true
creditapp.task.auto-approval=false
creditapp.points.initial-balance=0
creditapp.points.minimum-balance=0
creditapp.version=1.0.0

# ===================================================================
# Monitoring & Management (Production)
# ===================================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoints.web.base-path=/actuator
management.server.port=${MANAGEMENT_PORT:8081}

# Health indicators
management.health.db.enabled=true
management.health.diskspace.enabled=true
management.health.diskspace.threshold=1GB
