# Production Configuration for Credit Points Application
# Use with: mvn spring-boot:run -Dspring-boot.run.profiles=prod
# Or: java -jar target/credit-app-1.0.0.jar --spring.profiles.active=prod
#
# NOTE: Using MySQL database (192.168.9.113:3306)

# Application Configuration
spring.application.name=credit-app
server.port=8080

# MySQL Database (Production)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://192.168.9.113:3306/creditapp?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=12345

# JPA Configuration for MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# SQL Data Initialization
spring.sql.init.mode=embedded
spring.sql.init.enabled=true
spring.sql.init.continue-on-error=true
spring.jpa.defer-datasource-initialization=true

# H2 Console - DISABLED in production
spring.h2.console.enabled=false

# Thymeleaf Configuration (enable cache for production)
spring.thymeleaf.cache=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML

# Logging Configuration (less verbose in production)
logging.level.com.creditapp=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.file.name=logs/creditapp.log
logging.file.max-size=10MB
logging.file.max-history=30
logging.file.total-size-cap=100MB

# Server Configuration
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.error.include-stacktrace=never
server.error.include-message=always
server.error.include-binding-errors=never

# Security Configuration (Production)
# CSRF protection enabled
spring.security.csrf.enabled=true

# CORS Configuration (if needed for API)
# spring.web.cors.allowed-origins=http://your-domain.com
# spring.web.cors.allowed-methods=GET,POST,PUT,DELETE
# spring.web.cors.allowed-headers=*
# spring.web.cors.allow-credentials=true

# Connection Pool Configuration (HikariCP)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1

# Database Connection Properties
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048
spring.datasource.hikari.data-source-properties.useServerPrepStmts=true
spring.datasource.hikari.data-source-properties.useLocalSessionState=true
spring.datasource.hikari.data-source-properties.rewriteBatchedStatements=true
spring.datasource.hikari.data-source-properties.cacheResultSetMetadata=true
spring.datasource.hikari.data-source-properties.cacheServerConfiguration=true
spring.datasource.hikari.data-source-properties.elideSetAutoCommits=true
spring.datasource.hikari.data-source-properties.maintainTimeStats=false

# Application-specific settings
creditapp.default-parent-username=parent
creditapp.default-parent-password=parent123
creditapp.default-child-username=child
creditapp.default-child-password=child123

# Marketplace feature settings
creditapp.marketplace.enabled=true
creditapp.marketplace.max-tasks-per-child=10

# Task completion settings
creditapp.task.daily-limit-check=true
creditapp.task.auto-approval=false

# Points system settings
creditapp.points.initial-balance=0
creditapp.points.minimum-balance=0

# Deployment information
creditapp.version=1.0.0
creditapp.build-date=2026-02-03
creditapp.features=task-marketplace,daily-limits,draft-tasks,reward-system