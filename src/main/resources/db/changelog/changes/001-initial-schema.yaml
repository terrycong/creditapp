databaseChangeLog:
  - changeSet:
      id: 001-01
      author: liquibase
      comment: Create users table
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: points
                  type: INT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: parent_id
                  type: BIGINT
        - addSqlConstraint:
            constraintName: CHK_users_role
            tableName: users
            constraintSQL: role IN ('CHILD','PARENT')
        - addForeignKeyConstraint:
            baseTableName: users
            baseColumnNames: parent_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: FK_users_parent
