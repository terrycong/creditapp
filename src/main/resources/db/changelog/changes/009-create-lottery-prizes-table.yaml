databaseChangeLog:
  - changeSet:
      id: 009-create-lottery-prizes-table
      author: terrycong
      changes:
        - createTable:
            tableName: lottery_prizes
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: lottery_theme_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_lottery_prizes_theme
                    references: lottery_themes(id)
              - column:
                  name: name
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(500)
              - column:
                  name: weight
                  type: int
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false
              - column:
                  name: probability
                  type: int
              - column:
                  name: quantity
                  type: int
                  defaultValueNumeric: -1
                  constraints:
                    nullable: false
              - column:
                  name: redeemed_count
                  type: int
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: active
                  type: boolean
                  defaultValueBoolean: true
              - column:
                  name: image_url
                  type: varchar(500)
              - column:
                  name: reward_id
                  type: bigint
              - column:
                  name: created_at
                  type: datetime
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: datetime
