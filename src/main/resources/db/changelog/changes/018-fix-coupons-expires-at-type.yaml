databaseChangeLog:
  - changeSet:
      id: 018-fix-coupons-expires-at-type
      author: admin
      comment: Fix expires_at column type from TIMESTAMP to DATETIME to support dates beyond 2038
      changes:
        - modifyDataType:
            tableName: coupons
            columnName: expires_at
            newDataType: DATETIME
      rollback:
        - modifyDataType:
            tableName: coupons
            columnName: expires_at
            newDataType: TIMESTAMP
