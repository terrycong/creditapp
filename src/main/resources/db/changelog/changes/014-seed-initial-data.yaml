databaseChangeLog:
  - changeSet:
      id: 014-seed-initial-data
      author: terrycong
      changes:
        # Insert parent user (password: parent123)
        - insert:
            tableName: users
            columns:
              - column: { name: id, valueNumeric: 1 }
              - column: { name: username, value: parent }
              - column: { name: password, value: '$2a$10$BFeE1qUtBvthU1sKwEc.tOIzuFOw1D635dDscfC2cv1HcP1/Co0Su' }
              - column: { name: role, value: PARENT }
              - column: { name: points, valueNumeric: 0 }

        # Insert child user (password: child123)
        - insert:
            tableName: children
            columns:
              - column: { name: id, valueNumeric: 1 }
              - column: { name: username, value: child }
              - column: { name: password, value: '$2a$10$cV03s.di3hDvqXLPMiAvpucc7aLcLrWv5kHMFWIrOZXWdAtT4SsDi' }
              - column: { name: role, value: CHILD }
              - column: { name: parent_id, valueNumeric: 1 }
              - column: { name: points, valueNumeric: 0 }

        # Insert sample rewards
        - insert:
            tableName: rewards
            columns:
              - column: { name: id, valueNumeric: 1 }
              - column: { name: name, value: '游戏时间' }
              - column: { name: description, value: '30 分钟游戏时间' }
              - column: { name: quantity, valueNumeric: 999 }
              - column: { name: points_required, valueNumeric: 20 }
              - column: { name: active, valueBoolean: true }

        - insert:
            tableName: rewards
            columns:
              - column: { name: id, valueNumeric: 2 }
              - column: { name: name, value: '零花钱' }
              - column: { name: description, value: '10 元零花钱' }
              - column: { name: quantity, valueNumeric: 50 }
              - column: { name: points_required, valueNumeric: 100 }
              - column: { name: active, valueBoolean: true }

        - insert:
            tableName: rewards
            columns:
              - column: { name: id, valueNumeric: 3 }
              - column: { name: name, value: '外出游玩' }
              - column: { name: description, value: '周末去公园玩' }
              - column: { name: quantity, valueNumeric: 5 }
              - column: { name: points_required, valueNumeric: 200 }
              - column: { name: active, valueBoolean: true }

        - insert:
            tableName: rewards
            columns:
              - column: { name: id, valueNumeric: 4 }
              - column: { name: name, value: '冰淇淋' }
              - column: { name: description, value: '喜欢的冰淇淋一份' }
              - column: { name: quantity, valueNumeric: 999 }
              - column: { name: points_required, valueNumeric: 15 }
              - column: { name: active, valueBoolean: true }

        - insert:
            tableName: rewards
            columns:
              - column: { name: id, valueNumeric: 5 }
              - column: { name: name, value: '新玩具' }
              - column: { name: description, value: '买一个喜欢的玩具' }
              - column: { name: quantity, valueNumeric: 999 }
              - column: { name: points_required, valueNumeric: 500 }
              - column: { name: active, valueBoolean: true }

        # Insert lottery theme
        - insert:
            tableName: lottery_themes
            columns:
              - column: { name: id, valueNumeric: 1 }
              - column: { name: name, value: '幸运大转盘' }
              - column: { name: description, value: '每日抽奖机会，试试你的运气！' }
              - column: { name: points_per_draw, valueNumeric: 10 }
              - column: { name: type, value: WEIGHTED_RANDOM }
              - column: { name: active, valueBoolean: true }
              - column: { name: created_by_id, valueNumeric: 1 }

        # Insert lottery prizes (linked to rewards)
        - insert:
            tableName: lottery_prizes
            columns:
              - column: { name: id, valueNumeric: 1 }
              - column: { name: lottery_theme_id, valueNumeric: 1 }
              - column: { name: name, value: '冰淇淋' }
              - column: { name: description, value: '喜欢的冰淇淋一份' }
              - column: { name: weight, valueNumeric: 50 }
              - column: { name: quantity, valueNumeric: 999 }
              - column: { name: redeemed_count, valueNumeric: 0 }
              - column: { name: active, valueBoolean: true }
              - column: { name: reward_id, valueNumeric: 4 }

        - insert:
            tableName: lottery_prizes
            columns:
              - column: { name: id, valueNumeric: 2 }
              - column: { name: lottery_theme_id, valueNumeric: 1 }
              - column: { name: name, value: '游戏时间' }
              - column: { name: description, value: '30 分钟游戏时间' }
              - column: { name: weight, valueNumeric: 30 }
              - column: { name: quantity, valueNumeric: 999 }
              - column: { name: redeemed_count, valueNumeric: 0 }
              - column: { name: active, valueBoolean: true }
              - column: { name: reward_id, valueNumeric: 1 }

        - insert:
            tableName: lottery_prizes
            columns:
              - column: { name: id, valueNumeric: 3 }
              - column: { name: lottery_theme_id, valueNumeric: 1 }
              - column: { name: name, value: '零花钱' }
              - column: { name: description, value: '10 元零花钱' }
              - column: { name: weight, valueNumeric: 15 }
              - column: { name: quantity, valueNumeric: 50 }
              - column: { name: redeemed_count, valueNumeric: 0 }
              - column: { name: active, valueBoolean: true }
              - column: { name: reward_id, valueNumeric: 2 }

        - insert:
            tableName: lottery_prizes
            columns:
              - column: { name: id, valueNumeric: 4 }
              - column: { name: lottery_theme_id, valueNumeric: 1 }
              - column: { name: name, value: '新玩具' }
              - column: { name: description, value: '买一个喜欢的玩具' }
              - column: { name: weight, valueNumeric: 5 }
              - column: { name: quantity, valueNumeric: 999 }
              - column: { name: redeemed_count, valueNumeric: 0 }
              - column: { name: active, valueBoolean: true }
              - column: { name: reward_id, valueNumeric: 5 }
