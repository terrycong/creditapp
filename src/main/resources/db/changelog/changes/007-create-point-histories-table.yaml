databaseChangeLog:
  - changeSet:
      id: 007-create-point-histories-table
      author: terrycong
      changes:
        - createTable:
            tableName: point_histories
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: child_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_point_histories_child
                    references: children(id)
              - column:
                  name: points_change
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: balance_after
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: change_type
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(500)
              - column:
                  name: reference_id
                  type: bigint
              - column:
                  name: reference_type
                  type: varchar(50)
              - column:
                  name: created_at
                  type: datetime
                  defaultValueComputed: CURRENT_TIMESTAMP
