databaseChangeLog:
  - changeSet:
      id: 003-force-seed-data-if-not-exists
      author: creditapp
      comment: Force seed initial data if users table is empty
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM users
      changes:
        # Parent User
        - insert:
            tableName: users
            columns:
              - column: { name: username, value: 'parent' }
              - column: { name: password, value: '$2a$10$BFeE1qUtBvthU1sKwEc.tOIzuFOw1D635dDscfC2cv1HcP1/Co0Su' }
              - column: { name: role, value: 'PARENT' }
              - column: { name: points, valueNumeric: 0 }

        # Child User (need to get the auto-generated ID from parent insert)
        - sql:
            sql: INSERT INTO children (username, password, role, parent_id, points) 
                 SELECT 'child', '$2a$10$cV03s.di3hDvqXLPMiAvpucc7aLcLrWv5kHMFWIrOZXWdAtT4SsDi', 'CHILD', id, 0 
                 FROM users WHERE username='parent'
            dbms: mysql

        - sql:
            sql: INSERT INTO children (username, password, role, parent_id, points) 
                 SELECT 'child', '$2a$10$cV03s.di3hDvqXLPMiAvpucc7aLcLrWv5kHMFWIrOZXWdAtT4SsDi', 'CHILD', id, 0 
                 FROM users WHERE username='parent'
            dbms: h2

        # Direct Tasks
        - sql:
            sql: INSERT INTO tasks (title, description, points, type, status, created_by_id, active, created_at) 
                 VALUES ('完成作业', '按时完成学校作业', 10, 'DAILY_ONCE', 'APPROVED', (SELECT id FROM users WHERE username='parent'), true, NOW())
            dbms: mysql

        - sql:
            sql: INSERT INTO tasks (title, description, points, type, status, created_by_id, active, created_at) 
                 VALUES ('完成作业', '按时完成学校作业', 10, 'DAILY_ONCE', 'APPROVED', (SELECT id FROM users WHERE username='parent'), true, CURRENT_TIMESTAMP())
            dbms: h2

        - sql:
            sql: INSERT INTO tasks (title, description, points, type, status, created_by_id, active, created_at) 
                 VALUES ('打扫房间', '整理自己的房间', 5, 'REPEATABLE', 'APPROVED', (SELECT id FROM users WHERE username='parent'), true, NOW())
            dbms: mysql

        - sql:
            sql: INSERT INTO tasks (title, description, points, type, status, created_by_id, active, created_at) 
                 VALUES ('打扫房间', '整理自己的房间', 5, 'REPEATABLE', 'APPROVED', (SELECT id FROM users WHERE username='parent'), true, CURRENT_TIMESTAMP())
            dbms: h2

