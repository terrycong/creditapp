            dbms: mysql

        - sql:
            sql: INSERT INTO tasks (title, description, points, type, status, created_by_id, active, created_at) 
                 VALUES ('阅读书籍', '每天阅读 30 分钟课外书', 8, 'DAILY_ONCE', 'APPROVED', (SELECT id FROM users WHERE username='parent'), true, CURRENT_TIMESTAMP())
            dbms: h2

        - sql:
            sql: INSERT INTO tasks (title, description, points, type, status, created_by_id, active, created_at) 
                 VALUES ('帮助做家务', '帮忙洗碗或扫地', 7, 'REPEATABLE', 'APPROVED', (SELECT id FROM users WHERE username='parent'), true, NOW())
            dbms: mysql

        - sql:
            sql: INSERT INTO tasks (title, description, points, type, status, created_by_id, active, created_at) 
                 VALUES ('帮助做家务', '帮忙洗碗或扫地', 7, 'REPEATABLE', 'APPROVED', (SELECT id FROM users WHERE username='parent'), true, CURRENT_TIMESTAMP())
            dbms: h2

        # Task Jobs - MySQL
        - sql:
            sql: |
                INSERT INTO task_jobs (task_id, child_id, status, snapshot_title, snapshot_description, snapshot_points, snapshot_task_type, assigned_at, created_at)
                SELECT t.id, c.id, 'ASSIGNED', t.title, t.description, t.points, t.type, NOW(), NOW()
                FROM tasks t, children c
                WHERE t.created_by_id = (SELECT id FROM users WHERE username='parent')
                AND c.username = 'child'
                AND t.title IN ('完成作业', '打扫房间', '阅读书籍', '帮助做家务')
            dbms: mysql

        # Task Jobs - H2
        - sql:
            sql: |
                INSERT INTO task_jobs (task_id, child_id, status, snapshot_title, snapshot_description, snapshot_points, snapshot_task_type, assigned_at, created_at)
                SELECT t.id, c.id, 'ASSIGNED', t.title, t.description, t.points, t.type, CURRENT_TIMESTAMP(), CURRENT_TIMESTAMP()
                FROM tasks t, children c
                WHERE t.created_by_id = (SELECT id FROM users WHERE username='parent')
                AND c.username = 'child'
                AND t.title IN ('完成作业', '打扫房间', '阅读书籍', '帮助做家务')
            dbms: h2

