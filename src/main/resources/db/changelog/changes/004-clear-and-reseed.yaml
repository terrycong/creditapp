databaseChangeLog:
  - changeSet:
      id: 004-clear-and-reseed-data
      author: creditapp
      comment: Clear existing data and re-seed (one-time migration)
      preConditions:
        - onFail: MARK_RAN
        - tableExists:
            tableName: users
      changes:
        # Clear existing data (in correct order due to foreign keys)
        - delete:
            tableName: notifications
        - delete:
            tableName: lottery_draw_results
        - delete:
            tableName: lottery_draws
        - delete:
            tableName: lottery_prizes
        - delete:
            tableName: lottery_themes
        - delete:
            tableName: penalty_records
        - delete:
            tableName: penalty_rules
        - delete:
            tableName: point_history
        - delete:
            tableName: reward_redemptions
        - delete:
            tableName: rewards
        - delete:
            tableName: task_completions
        - delete:
            tableName: task_jobs
        - delete:
            tableName: tasks
        - delete:
            tableName: children
        - delete:
            tableName: users
            
        # Now re-insert data
        - insert:
            tableName: users
            columns:
              - column: { name: username, value: 'parent' }
              - column: { name: password, value: '$2a$10$BFeE1qUtBvthU1sKwEc.tOIzuFOw1D635dDscfC2cv1HcP1/Co0Su' }
              - column: { name: role, value: 'PARENT' }
              - column: { name: points, valueNumeric: 0 }

        - sql:
            sql: INSERT INTO children (username, password, role, parent_id, points) SELECT 'child', '$2a$10$cV03s.di3hDvqXLPMiAvpucc7aLcLrWv5kHMFWIrOZXWdAtT4SsDi', 'CHILD', id, 0 FROM users WHERE username='parent'

        - sql:
            sql: INSERT INTO tasks (title, description, points, type, status, created_by_id, active, created_at) VALUES ('完成作业', '按时完成学校作业', 10, 'DAILY_ONCE', 'APPROVED', (SELECT id FROM users WHERE username='parent'), true, NOW())

        - sql:
            sql: INSERT INTO tasks (title, description, points, type, status, created_by_id, active, created_at) VALUES ('打扫房间', '整理自己的房间', 5, 'REPEATABLE', 'APPROVED', (SELECT id FROM users WHERE username='parent'), true, NOW())

        - sql:
            sql: INSERT INTO tasks (title, description, points, type, status, created_by_id, active, created_at) VALUES ('阅读书籍', '每天阅读 30 分钟课外书', 8, 'DAILY_ONCE', 'APPROVED', (SELECT id FROM users WHERE username='parent'), true, NOW())

        - sql:
