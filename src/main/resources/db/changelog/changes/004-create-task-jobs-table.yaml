databaseChangeLog:
  - changeSet:
      id: 004-create-task-jobs-table
      author: terrycong
      changes:
        - createTable:
            tableName: task_jobs
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: task_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_task_jobs_task
                    references: tasks(id)
              - column:
                  name: child_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_task_jobs_child
                    references: children(id)
              - column:
                  name: status
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: snapshot_title
                  type: varchar(200)
              - column:
                  name: snapshot_description
                  type: varchar(1000)
              - column:
                  name: snapshot_points
                  type: int
              - column:
                  name: snapshot_task_type
                  type: varchar(50)
              - column:
                  name: assigned_at
                  type: datetime
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: submitted_at
                  type: datetime
              - column:
                  name: approved_at
                  type: datetime
              - column:
                  name: rejected_at
                  type: datetime
              - column:
                  name: created_at
                  type: datetime
                  defaultValueComputed: CURRENT_TIMESTAMP
