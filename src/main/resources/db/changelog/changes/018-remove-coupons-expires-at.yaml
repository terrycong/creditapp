databaseChangeLog:
  - changeSet:
      id: 018-remove-coupons-expires-at
      author: admin
      comment: Remove expires_at field from coupons table - no expiration management needed
      changes:
        - dropColumn:
            tableName: coupons
            columnName: expires_at
      rollback:
        - addColumn:
            tableName: coupons
            columns:
              - column:
                  name: expires_at
                  type: DATETIME
                  constraints:
                    nullable: false
