databaseChangeLog:
  - changeSet:
      id: 012-create-penalty-rules-table
      author: terrycong
      changes:
        - createTable:
            tableName: penalty_rules
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: varchar(500)
              - column:
                  name: points_deduction
                  type: int
                  constraints:
                    nullable: false
              - column:
                  name: active
                  type: boolean
                  defaultValueBoolean: true
              - column:
                  name: created_by_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_penalty_rules_creator
                    references: users(id)
              - column:
                  name: created_at
                  type: datetime
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: datetime
